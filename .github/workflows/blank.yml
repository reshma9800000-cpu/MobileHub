<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shoplyfire | Fresh Finds, Best Prices</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f7fb;color:#222}
header{position:sticky;top:0;background:#fff;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.logo{font-size:28px;font-weight:700;color:#6C3DF4}
nav a{text-decoration:none;color:#333;margin-left:20px;font-weight:600}
.hero{height:90vh;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.35)),url('https://i.ibb.co/wZzjYQW1/happy-beautiful-couple-posing-with-shopping-bags-violet-1.jpg') center/cover;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
.hero h1{font-size:60px}
.hero p{margin:15px 0 25px;font-size:20px}
.btn{background:#fff;color:#222;padding:14px 24px;border-radius:10px;text-decoration:none;font-weight:bold}
section{max-width:1100px;margin:auto;padding:70px 20px}
.title{text-align:center;margin-bottom:35px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.card img{width:100%;height:260px;object-fit:cover}
.info{padding:18px}
.price{font-size:22px;font-weight:bold;color:#6C3DF4;margin:8px 0}
button{border:0;border-radius:8px;padding:11px 15px;font-weight:bold;cursor:pointer}
.add{background:#6C3DF4;color:#fff;width:100%}
.contact{text-align:center;background:#fff;border-radius:16px;padding:30px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
footer{background:#111;color:#ddd;text-align:center;padding:30px;margin-top:50px}
.cart{position:fixed;bottom:20px;right:20px;background:#6C3DF4;color:#fff;padding:14px 18px;border-radius:50px;cursor:pointer;font-weight:bold}
.drawer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55)}
.panel{position:absolute;right:0;top:0;width:360px;height:100%;background:#fff;padding:20px;overflow:auto}
input,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
.pay{display:block;text-align:center;background:#25D366;color:#fff;padding:12px;border-radius:8px;text-decoration:none;margin-top:10px}
</style>
</head>
<body>

<header>
  <div class="logo">Shoplyfire</div>
  <nav>
    <a href="#products">Products</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="hero">
  <div>
    <h1>Shop Smart, Shoplyfire</h1>
    <p>Fresh Finds, Best Prices</p>
    <a class="btn" href="#products">Shop Now</a>
  </div>
</section>

<section id="products">
  <div class="title">
    <h2>Featured Products</h2>
    <p>Premium collection with affordable prices</p>
  </div>
  <div class="grid" id="productsList"></div>
</section>

<section id="contact">
  <div class="contact">
    <h2>Contact Shoplyfire</h2>
    <p>Email: <b>sksarjatali0@gmail.com</b></p>
    <p>WhatsApp: <b>9641755038</b></p>
    <a class="pay" href="https://razorpay.me/@sksarjatali" target="_blank">💳 Pay with Razorpay</a>
  </div>
</section>

<footer>
  <h3>Shoplyfire</h3>
  <p>Fresh Finds, Best Prices</p>
  <p>© 2026 Shoplyfire</p>
</footer>

<div class="cart" onclick="openCart()">🛒 <span id="count">0</span></div>

<div class="drawer" id="drawer">
  <div class="panel">
    <h2>Your Cart</h2>
    <div id="items"></div>
    <h3>Total: ₹<span id="total">0</span></h3>
    <hr><br>
    <input id="name" placeholder="Your Name">
    <input id="phone" placeholder="Phone Number">
    <textarea id="address" placeholder="Delivery Address"></textarea>
    <button class="add" onclick="emailOrder()">📧 Send Order</button>
    <a class="pay" href="https://razorpay.me/@sksarjatali" target="_blank">Pay Now</a>
    <br>
    <button onclick="closeCart()" style="width:100%;background:#888;color:#fff">Close</button>
  </div>
</div>

<script>
const products=[
 {name:"Featured Product 01",price:499,img:"https://i.ibb.co/SwKmvYPS/Screenshot-20260909-101052.jpg"},
 {name:"Featured Product 02",price:699,img:"https://i.ibb.co/yFr0P33/image.jpg"},
 {name:"Featured Product 03",price:999,img:"https://i.ibb.co/chKzbf73/image.jpg"}
];
let cart=[];
const list=document.getElementById("productsList");
products.forEach((p,i)=>{
 list.innerHTML+=`<div class="card">
   <img src="${p.img}">
   <div class="info">
    <h3>${p.name}</h3>
    <div class="price">₹${p.price}</div>
    <button class="add" onclick="add(${i})">Add to Cart</button>
   </div></div>`;
});
function add(i){
 let f=cart.find(x=>x.name===products[i].name);
 if(f)f.qty++; else cart.push({...products[i],qty:1});
 render();
}
function render(){
 document.getElementById("count").textContent=cart.reduce((a,b)=>a+b.qty,0);
 let html="",t=0;
 cart.forEach(c=>{
  t+=c.price*c.qty;
  html+=`<p><b>${c.name}</b><br>₹${c.price} × ${c.qty}</p><hr>`;
 });
 document.getElementById("items").innerHTML=html||"Cart Empty";
 document.getElementById("total").textContent=t;
}
function openCart(){drawer.style.display="block"}
function closeCart(){drawer.style.display="none"}
function emailOrder(){
 if(!cart.length){alert("Cart Empty");return;}
 let body="Shoplyfire Order%0A";
 cart.forEach(c=>body+=`${c.name} x${c.qty} = ₹${c.price*c.qty}%0A`);
 body+=`%0AName: ${name.value}%0APhone: ${phone.value}%0AAddress: ${address.value}`;
 location.href=`mailto:sksarjatali0@gmail.com?subject=New Shoplyfire Order&body=${body}`;
}
</script>

</body>
</html>
